    <path d="M8 14 v14 M8 8 v1 M16 28 v-10 c0-6 10-6 10 0 v10"/>
    <circle cx="78" cy="17" r="17"/>
    <path d="M68 20 c0 8 20 8 20 0 v-6 c0-8-20-8-20 0z"/>
