  <text x="80" y="866" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Created by Kori Pickle</text>
  <text x="80" y="895" font-family="Brush Script MT, Segoe Script, cursive" font-size="34" fill="#2B2B2B" transform="skewX(-8)">Kori Pickle</text>
  <g transform="translate(1260 848)" fill="none" stroke="#000000" stroke-width="3" opacity=".78">
